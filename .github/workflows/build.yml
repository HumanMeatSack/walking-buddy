name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./scripts/build.sh
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: Walking-Buddy-macOS
          path: .build/Walking-Buddy-macOS.zip
